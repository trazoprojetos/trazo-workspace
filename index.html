<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazo Workspace | Engenharia & Arquitetura</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX no browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#070b19] text-slate-100 font-sans m-0 p-0 selection:bg-cyan-500/30">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const LucideIcons = window.lucide;

      const DEFAULT_COLUMNS = [
        { id: 'solicitacoes', label: 'Solicitações', color: 'bg-slate-900/80 border-slate-700' },
        { id: 'elaboracao', label: 'Em Elaboração', color: 'bg-blue-950/50 border-blue-800/60' },
        { id: 'protocolado', label: 'Protocolado', color: 'bg-amber-950/50 border-amber-800/60' },
        { id: 'execucao', label: 'Execução', color: 'bg-purple-950/50 border-purple-800/60' },
        { id: 'concluido', label: 'Concluído', color: 'bg-emerald-950/50 border-emerald-800/60' },
      ];

      function App() {
        const [columns, setColumns] = useState(DEFAULT_COLUMNS);
        const [cards, setCards] = useState([
          { id: '1', title: 'Projeto de Incêndio - Matriz', status: 'solicitacoes', client: 'Empresa A' },
          { id: '2', title: 'Regularização AVCB - Loja Centro', status: 'elaboracao', client: 'Comércio B' }
        ]);
        const [currentView, setCurrentView] = useState('kanban');
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [newTitle, setNewTitle] = useState('');
        const [newClient, setNewClient] = useState('');

        const handleAddCard = (e) => {
          e.preventDefault();
          if (!newTitle.trim()) return;
          setCards(prev => [...prev, { id: `card_${Date.now()}`, title: newTitle, client: newClient || 'Cliente Geral', status: 'solicitacoes' }]);
          setNewTitle('');
          setNewClient('');
          setIsModalOpen(false);
        };

        return (
          <div className="min-h-screen bg-[#070b19] text-slate-100 flex flex-col md:flex-row relative">
            <aside className="w-full md:w-64 bg-[#0a1128]/90 backdrop-blur-xl border-r border-slate-800 p-6 flex flex-col justify-between shrink-0">
              <div>
                <h1 className="text-2xl font-serif text-slate-100 tracking-widest font-extralight">TRAZO</h1>
                <p className="text-[9px] text-slate-400 tracking-[0.25em] uppercase mt-0.5">ENGENHARIA & ARQUITETURA</p>
                <div className="mt-2 px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-[10px] text-cyan-400 font-mono inline-block font-semibold">
                  WORKSPACE PRO
                </div>

                <nav className="mt-6 space-y-2">
                  <button onClick={() => setCurrentView('kanban')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-sm font-medium ${currentView === 'kanban' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40' : 'text-slate-400 hover:bg-white/5'}`}>
                    <span>Painel Kanban</span>
                  </button>
                  <button onClick={() => setCurrentView('clients')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all text-sm font-medium ${currentView === 'clients' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40' : 'text-slate-400 hover:bg-white/5'}`}>
                    <span>Clientes Cadastrados</span>
                  </button>
                </nav>
              </div>

              <div className="p-3 bg-[#080d1e] border border-slate-800 rounded-2xl text-xs space-y-1">
                <div className="font-bold text-slate-200">Gabriella Gontijo</div>
                <div className="text-[10px] text-cyan-400">Engenheira / Gestora Master</div>
              </div>
            </aside>

            <main className="flex-1 flex flex-col h-screen overflow-hidden">
              <header className="px-6 py-4 border-b border-slate-800 bg-[#0a1128]/60 backdrop-blur-md flex justify-between items-center">
                <h2 className="text-xl font-extrabold text-slate-100">
                  {currentView === 'kanban' ? 'Painel Kanban Operacional' : 'Gestão de Clientes'}
                </h2>
                <button onClick={() => setIsModalOpen(true)} className="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg transition-all">
                  + Novo Cartão
                </button>
              </header>

              <div className="flex-1 p-6 overflow-auto">
                {currentView === 'kanban' ? (
                  <div className="flex space-x-4 overflow-x-auto pb-4 h-full items-start">
                    {columns.map(col => {
                      const columnCards = cards.filter(c => c.status === col.id);
                      return (
                        <div key={col.id} className={`w-80 rounded-2xl border flex flex-col shrink-0 shadow-2xl ${col.color}`}>
                          <div className="p-3.5 border-b border-slate-800 flex justify-between items-center bg-[#070d1e] rounded-t-2xl">
                            <span className="font-bold text-xs uppercase tracking-wider text-slate-200">{col.label}</span>
                            <span className="bg-cyan-500/20 text-cyan-300 text-[10px] px-2 py-0.5 rounded-full font-bold">{columnCards.length}</span>
                          </div>
                          <div className="p-3 space-y-3 flex-1 overflow-y-auto max-h-[70vh]">
                            {columnCards.map(card => (
                              <div key={card.id} className="bg-[#0e1738] border border-slate-700/60 rounded-2xl p-4 shadow-xl space-y-2">
                                <span className="text-[10px] text-cyan-400 font-mono block">{card.client}</span>
                                <h4 className="font-bold text-sm text-slate-100">{card.title}</h4>
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="text-slate-300 text-sm p-4 bg-[#0a1128] border border-slate-800 rounded-2xl">
                    Lista de clientes associados aos projetos do escritório.
                  </div>
                )}
              </div>
            </main>

            {isModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                <div className="bg-[#0a1128] border border-slate-800 rounded-3xl p-6 w-full max-w-lg space-y-4 shadow-2xl">
                  <h3 className="text-lg font-bold text-slate-100">Criar Novo Cartão Kanban</h3>
                  <div className="space-y-3">
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Título do Projeto / Solicitação</label>
                      <input type="text" placeholder="Ex: Projeto AVCB" value={newTitle} onChange={e => setNewTitle(e.target.value)} className="bg-slate-950 border border-slate-800 text-slate-100 text-sm rounded-xl p-3 w-full outline-none focus:border-cyan-500" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Nome do Cliente</label>
                      <input type="text" placeholder="Ex: Construtora XYZ" value={newClient} onChange={e => setNewClient(e.target.value)} className="bg-slate-950 border border-slate-800 text-slate-100 text-sm rounded-xl p-3 w-full outline-none focus:border-cyan-500" />
                    </div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl">Cancelar</button>
                    <button onClick={handleAddCard} className="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl">Salvar Cartão</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
