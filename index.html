<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazo Workspace | Engenharia & Arquitetura</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#070b19] text-slate-100 font-sans m-0 p-0 selection:bg-cyan-500/30">
    <div id="app" class="min-h-screen flex flex-col md:flex-row">
      <!-- Sidebar -->
      <aside class="w-full md:w-64 bg-[#0a1128] border-r border-slate-800 p-6 flex flex-col justify-between shrink-0">
        <div>
          <h1 class="text-2xl font-serif text-slate-100 tracking-widest font-extralight">TRAZO</h1>
          <p class="text-[9px] text-slate-400 tracking-[0.25em] uppercase mt-0.5">ENGENHARIA & ARQUITETURA</p>
          <div class="mt-2 px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-[10px] text-cyan-400 font-mono inline-block">
            WORKSPACE PRO
          </div>

          <nav class="mt-6 space-y-2">
            <div class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-cyan-500/15 text-cyan-300 border border-cyan-500/30 text-sm font-medium">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
              <span>Painel Kanban</span>
            </div>
          </nav>
        </div>

        <div class="p-3 bg-[#080d1e] border border-slate-800 rounded-2xl text-xs space-y-1">
          <div class="font-bold text-slate-200">Gabriella Gontijo</div>
          <div class="text-[10px] text-cyan-400">Engenheira / Gestora Master</div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="px-6 py-4 border-b border-slate-800 bg-[#0a1128]/60 backdrop-blur-md flex justify-between items-center">
          <h2 class="text-xl font-extrabold text-slate-100">Painel Kanban Operacional</h2>
          <button onclick="alert('Funcionalidade ativa no ambiente corporativo!')" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg flex items-center space-x-2 transition-all">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Novo Cartão</span>
          </button>
        </header>

        <div class="flex-1 p-6 overflow-auto flex space-x-4 items-start">
          <!-- Coluna 1 -->
          <div class="w-80 bg-[#0a1128] border border-slate-800 rounded-2xl flex flex-col shrink-0 shadow-2xl">
            <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-[#070d1e] rounded-t-2xl">
              <span class="font-bold text-xs uppercase tracking-wider text-slate-200">Solicitações</span>
              <span class="bg-cyan-500/20 text-cyan-300 text-[10px] px-2 py-0.5 rounded-full font-bold">1</span>
            </div>
            <div class="p-3 space-y-3">
              <div class="bg-[#0e1738] border border-slate-700/60 rounded-2xl p-4 shadow-xl space-y-2">
                <h4 class="font-bold text-sm text-slate-100">Projeto de Incêndio - Matriz</h4>
                <span class="text-[10px] px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-bold inline-block">CLCB</span>
              </div>
            </div>
          </div>

          <!-- Coluna 2 -->
          <div class="w-80 bg-[#0a1128] border border-slate-800 rounded-2xl flex flex-col shrink-0 shadow-2xl">
            <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-[#070d1e] rounded-t-2xl">
              <span class="font-bold text-xs uppercase tracking-wider text-slate-200">Em Elaboração</span>
              <span class="bg-blue-500/20 text-blue-300 text-[10px] px-2 py-0.5 rounded-full font-bold">1</span>
            </div>
            <div class="p-3 space-y-3">
              <div class="bg-[#0e1738] border border-slate-700/60 rounded-2xl p-4 shadow-xl space-y-2">
                <h4 class="font-bold text-sm text-slate-100">Regularização AVCB - Loja Centro</h4>
                <span class="text-[10px] px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-bold inline-block">AVCB</span>
              </div>
            </div>
          </div>

          <!-- Coluna 3 -->
          <div class="w-80 bg-[#0a1128] border border-slate-800 rounded-2xl flex flex-col shrink-0 shadow-2xl">
            <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-[#070d1e] rounded-t-2xl">
              <span class="font-bold text-xs uppercase tracking-wider text-slate-200">Protocolado</span>
              <span class="bg-amber-500/20 text-amber-300 text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
            </div>
            <div class="p-3 space-y-3 min-h-[100px]"></div>
          </div>

          <!-- Coluna 4 -->
          <div class="w-80 bg-[#0a1128] border border-slate-800 rounded-2xl flex flex-col shrink-0 shadow-2xl">
            <div class="p-3.5 border-b border-slate-800 flex justify-between items-center bg-[#070d1e] rounded-t-2xl">
              <span class="font-bold text-xs uppercase tracking-wider text-slate-200">Concluído</span>
              <span class="bg-emerald-500/20 text-emerald-300 text-[10px] px-2 py-0.5 rounded-full font-bold">0</span>
            </div>
            <div class="p-3 space-y-3 min-h-[100px]"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Inicializa os ícones do Lucide -->
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
