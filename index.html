<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazo Workspace | Engenharia & Arquitetura</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#070b19] text-slate-100 font-sans antialiased">
    <div id="root"></div>

    <!-- Import do código React como módulo do Babel -->
    <script type="text/babel" data-type="module" src="./App.jsx"></script>

    <script type="text/babel" data-type="module">
      window.addEventListener('load', () => {
        const rootElement = document.getElementById('root');
        if (rootElement && window.App) {
          const root = ReactDOM.createRoot(rootElement);
          root.render(React.createElement(window.App));
        }
      });
    </script>
  </body>
</html>
