<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazo Workspace | Engenharia & Arquitetura</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Lucide Icons Global -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body class="bg-[#070b19] text-slate-100 font-sans antialiased">
    <div id="root"></div>

    <!-- 1. Carrega o ficheiro do App primeiro -->
    <script type="text/babel" src="./App.jsx"></script>

    <!-- 2. Inicializa e renderiza imediatamente a aplicação -->
    <script type="text/babel">
      const LucideIcons = window.lucide;
      
      const rootElement = document.getElementById('root');
      if (rootElement && window.App) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(React.createElement(window.App));
      }
    </script>
  </body>
</html>
