<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trazo Workspace | Engenharia & Arquitetura</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (Versão 18) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para compilar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#070b19] text-slate-100 font-sans antialiased m-0 p-0">
    <div id="root"></div>

    <!-- Import do App.jsx -->
    <script type="text/babel" src="./App.jsx"></script>

    <!-- Script de Inicialização Segura com Intervalo -->
    <script type="text/babel">
      window.LucideIcons = window.lucide;

      const iniciarApp = () => {
        const rootElement = document.getElementById('root');
        if (rootElement && window.App) {
          try {
            const root = ReactDOM.createRoot(rootElement);
            root.render(React.createElement(window.App));
            clearInterval(timer);
          } catch (e) {
            console.error("Erro ao renderizar:", e);
          }
        }
      };

      const timer = setInterval(iniciarApp, 200);
      window.addEventListener('DOMContentLoaded', iniciarApp);
    </script>
  </body>
</html>
